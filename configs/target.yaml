dataset:
  name: tinystories
  split: train
  text_column: text

  sampling:
    strategy: random
    max_stories: 50000
    max_train_samples: 50000
    seed: 42

tokenizer: gpt2

model:
  block_size: 128          
  num_layers: 6
  d_model: 1024             
  d_ffn: 4096              
  num_heads: 8            
  rms_norm_eps: 1.0e-6

training:
  batch_size: 8
  learning_rate: 3.0e-4
  weight_decay: 0.0
  num_epochs: 3
  num_workers: 4
  log_interval: 100

runtime:
  device: cuda
  seed: 42

output:
  checkpoint: checkpoints/target.pth
