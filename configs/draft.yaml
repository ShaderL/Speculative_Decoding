dataset:
  name: tinystories
  split: train
  text_column: text

  sampling:
    strategy: random
    max_stories: 20000
    max_train_samples: 20000
    seed: 42

tokenizer: gpt2

model:
  block_size: 128
  num_layers: 2
  d_model: 256
  d_ffn: 512
  num_heads: 4
  rms_norm_eps: 1.0e-6

training:
  batch_size: 32
  learning_rate: 6.0e-4
  weight_decay: 0.0
  num_epochs: 2
  num_workers: 4
  log_interval: 100

runtime:
  device: auto
  seed: 42

output:
  checkpoint: checkpoints/draft.pth
